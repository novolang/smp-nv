[package]
name        = "smp-nv"
version     = "0.0.8"
description = "The Bluetooth Security Manager Protocol as a state machine that performs nothing: feed it PDUs, entropy and a person's answer, and it returns the actions a host must take.  LE Legacy and LE Secure Connections, the pairing toolbox, and key distribution.  The toolbox and the packet codec work; the state machine is not written."
license     = "Apache-2.0"

# The toolbox and the packet codec have bodies; the state machine is
# still a `todo()`, so the package stays a draft at 0.0.x.
stability   = "draft"

# `core`, and the `Action` enum is what makes that true rather than
# aspirational: pairing needs entropy, a person and a radio, and every
# one of them is a variant this returns instead of an effect it
# declares.
layer       = "core"

category    = "networking"

tags        = ["bluetooth", "ble", "smp", "pairing", "bonding", "secure-connections", "sans-io", "security-manager", "embedded"]
repository  = "https://github.com/novolang/smp-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.22.0"

[docs.pages]
"README.md" = "Pairing, without a radio"

[dependencies]
# The curve, for LE Secure Connections: a local key pair from the
# entropy the host feeds in, and the ECDH that turns the peer's public
# key into the DHKey f5 consumes.
p256-nv = "^0.1.0"

[withdrawn]
replaced_by = "ble-codec-nv"
reason      = "The SMP PDU codec moved into ble-codec-nv, the pairing functions into crypto-ble-ecc and the pairing state machine into noble."
